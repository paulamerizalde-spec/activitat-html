<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Taules Complexes i Fusionades</title>
</head>
<body>

    <h2>Ejercicio 7: Tabla básica D1/D2/D3/D4</h2>
    <table border="1">
        <tr>
            <td colspan="2">AB</td>
        </tr>
        <tr>
            <td>D1</td>
            <td>D2</td>
        </tr>
        <tr>
            <td colspan="2">C</td>
        </tr>
        <tr>
            <td>D3</td>
            <td>D4</td>
        </tr>
    </table>

    <br><hr><br>

    <h2>Ejercicio 8: Tabla Anidada</h2>
    <table border="1">
        <tr>
            <td>A</td>
        </tr>
        <tr>
            <td>
                <table border="1">
                    <tr>
                        <td>
                            <table border="1">
                                <tr><td>B1</td></tr>
                                <tr><td>B2</td></tr>
                                <tr><td>B3</td></tr>
                            </table>
                        </td>
                        <td>
                            <table border="1">
                                <tr>
                                    <td>C1</td>
                                    <td>C2</td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>

    <br><hr><br>

    <h2>Ejercicio 12: Tabla con Colspan y Rowspan</h2>
    <table border="1" cellpadding="10">
        <tr>
            <td rowspan="2">A</td>
            <td colspan="2">B</td>
        </tr>
        <tr>
            <td>C</td>
            <td>D</td>
        </tr>
        <tr>
            <td colspan="2">E</td>
            <td>F</td>
        </tr>
    </table>

</body>
</html>
